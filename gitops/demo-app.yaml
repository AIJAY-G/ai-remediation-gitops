apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: ai-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        ai-remediation/restarted-at: 2026-11-10T05:36:12.421672+00:00-ba3166c6acdd
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: ai-remediation
spec:
  selector:
    app: demo-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
