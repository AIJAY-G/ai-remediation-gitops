apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: kube-guard-lab
  labels:
    app: lab-app
    environment: isolation-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
        environment: isolation-lab
      annotations:
        ai-remediation/restarted-at: 2026-11-03T10:10:28.291863+00:00-5e9e9748cf3d
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        command:
        - /bin/sh
        - -c
        - echo intentional failure in lab-app; exit 1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-app
  namespace: kube-guard-lab
  labels:
    app: lab-app
spec:
  selector:
    app: lab-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
