apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-remediation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AIJAY-G/ai-remediation-gitops.git
    targetRevision: main
    path: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-remediation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
